<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음반관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
    <script>
        let API_URL = "https://6adea6d64e88f1bba4a539f6.mockapi.io/users"
        let editingId = null;
        let songs = null;

        async function GETSongs() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                songs = await response.json();
                console.log("받아온 곡 데이터:", songs);

                renderSong(songs);
            } catch (error) {
                console.error("데이터 로드 실패:", error);
            }
        }

        function renderSong(songs) {
            const list = document.getElementById("cblist");
            list.replaceChildren();

            songs.forEach(song => {
                const li = document.createElement("li");
                li.className = "list-group-item mb-3";

                li.textContent = `${song.id} / ${song.songname} / ${song.singername} / ${song.kindof}`;

                const buttonm = document.createElement("button");
                buttonm.textContent = "수정";
                buttonm.className = "btn btn-sm btn-outline-primary me-1";
                buttonm.addEventListener("click", function () {
                    modifyItem(song.id);
                });

                const buttonx = document.createElement("button");
                buttonx.textContent = "삭제";
                buttonx.className = "btn btn-sm btn-outline-danger";
                buttonx.addEventListener("click", function () {
                    removeItem(song.id);
                });

                li.appendChild(buttonm);
                li.appendChild(buttonx);
                list.appendChild(li);
            });
        };

        function modifyItem(id) {
            const target = songs.find(song => song.id == id);
            if (!target) return;

            document.querySelector('#bname').value = target.songname;
            document.querySelector('#author').value = target.singername;
            document.querySelector('#sort').value = target.kindof;
            document.querySelector('#when').value = target.when;
            document.querySelector('#who').value = target.who;

            document.querySelector("#btn").textContent = "수정 완료";
            editingId = id;
            document.querySelector('#bname').focus();
        }

        async function removeItem(id) {
            const sure = confirm("삭제하시겠습니까?");
            if (!sure) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                await GETSongs();   // 삭제 성공 후 최신 목록 다시 불러오기
            } catch (error) {
                console.error("삭제 실패:", error);
            }
        }

        async function addsong(songname, singername, kindof, when, who) {
            const newSong = {
                songname: songname,
                singername: singername,
                kindof: kindof,
                when: when,
                who: who
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newSong)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                await GETSongs();   // 저장 성공 후 최신 목록 다시 불러오기
            } catch (error) {
                console.error("등록 실패:", error);
            }
        }

        window.addEventListener("DOMContentLoaded", function () {
            GETSongs();
            const form = document.querySelector('#list');
            const bname = document.querySelector("#bname");
            const author = document.querySelector("#author");
            const when = document.querySelector("#when");
            const who = document.querySelector("#who");
            const sort = document.querySelector("#sort");
            const btn = document.querySelector("#btn");

            btn.addEventListener("click", function (e) {
                e.preventDefault();
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                if (editingId !== null) {

                } else {
                    addsong(bname.value, author.value, when.value, who.value, sort.value);
                }
                bname.value = "";
                author.value = "";
                when.value = "";
                who.value = "";
                sort.value = "";
                bname.focus();
                GETSongs();

            });

        });

    </script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expend lg navbar-dark bg-primary">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold">음반관리</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800;">
        <div class="card shdow-sm border-0 mb-4">
            <div class="card-body p-4">
                <form id="list">
                    <h2 class="card-title h4 fw-bold text-primary mb-3">도서 추가하기</h2>
                    <div class="mb-3">
                        <label for="bname">음반 이름</label>
                        <input type="text" class="form-control" id="bname" name="bname" placeholder="도서 이름을 입력해주세요"
                            required minlength="1">
                    </div>

                    <div class="mb-3">
                        <label for="author">작곡가</label>
                        <input type="text" class="form-control" id="author" name="author" placeholder="저자 이름을 입력해주세요"
                            required minlength="2">
                    </div>

                    <div class="mb-3">
                        <label for="btype">분야</label>
                        <input list="btype" class="form-control" name="sort" id="sort" placeholder="ex. 철학, 문학, 예술..."
                            required minlength="2">
                        <datalist id="btype">
                            <option value="발라드"></option>
                            <option value="락"></option>
                            <option value="인디"></option>
                            <option value="힙합"></option>
                            <option value="클래식"></option>
                            <option value="컨트리"></option>
                            <option value="클럽"></option>
                            <option value="pop"></option>
                            <option value="jpop"></option>
                            <option value="kpop"></option>
                        </datalist>
                    </div>
                    <div class="d-flex justify-content-between">
                        <div class="mb-3 col-4">
                            <label for="when">음반 매입</label>
                            <input type="date" class="form-control" id="when" name="when" required>
                        </div>

                        <div class="mb-3 col-8">
                            <label for="who">매입자 이메일</label>
                            <input type="email" class="form-control" id="who" name="who" placeholder="이메일주소를 입력해주세요"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btn">도서 등록</button>

                </form>
            </div>
        </div>
    </div>
    <div class="container card shadow-sm border-0 mb-4" style="max-width: 800;">
        <div class="card-body p-4">
            <h2>매입한 음반 목록</h2>
            <ul id="cblist"></ul>
        </div>
    </div>
</body>

</html>
