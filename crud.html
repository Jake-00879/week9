<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>

<body>
    <nav>
        <div>
            <a>도서관리</a>
        </div>
    </nav>
    <form>
        <h2>도서 추가하기</h2>
        <label for="bname">도서 이름</label>

        <input type="text">
        <label for="author">저자 이름</label>

        <input type="text">
        <label for="sort">도서 분야</label>

        <input list="btype">
        <datalist id="btype">
            <option value="총류"></option>
            <option value="철학"></option>
            <option value="종교"></option>
            <option value="사회과학"></option>
            <option value="자연과학"></option>
            <option value="기술과학"></option>
            <option value="예술"></option>
            <option value="언어"></option>
            <option value="문학"></option>
            <option value="역사"></option>
        </datalist>

        <label for="when">반입일자</label>
        <input type="date">

        <button type="submit">도서 등록</button>

    </form>
</body>

</html>
